# keybinds.conf
$mainMod = SUPER # Sets "Windows" key as main modifier

# Command vars
$terminal = ghostty
$browser = zen-browser
$filemanager = dolphin
$menu = rofi -show combi -combi-modes "drun,window" -modes combi

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# Add 'uwsm app --' because it runs these apps as separate processes instead of all under hyprland
bind = $mainMod, Q, exec, uwsm app -- $terminal
bind = $mainMod, D, exec, uwsm app -- $browser
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, uwsm stop
bind = $mainMod, E, exec, uwsm app -- $filemanager
bind = $mainMod, V, togglefloating,
bind = $mainMod, W, exec, uwsm app -- $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, T, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod SHIFT, D, movetoworkspace, empty

# Switch to workspaces 1-5 (per monitor)
bind = $mainMod, 1, workspace, m~1
bind = $mainMod, 2, workspace, m~2
bind = $mainMod, 3, workspace, m~3
bind = $mainMod, 4, workspace, m~4
bind = $mainMod, 5, workspace, m~5

# Switch to workspaces 1-5 with focused window (per monitor)
bind = $mainMod SHIFT, 1, movetoworkspace, m~1
bind = $mainMod SHIFT, 2, movetoworkspace, m~2
bind = $mainMod SHIFT, 3, movetoworkspace, m~3
bind = $mainMod SHIFT, 4, movetoworkspace, m~4
bind = $mainMod SHIFT, 5, movetoworkspace, m~5

# Scroll through existing workspaces with mainMod + scroll (per monitor)
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
