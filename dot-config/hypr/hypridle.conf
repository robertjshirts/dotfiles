general {
    lock_cmd = pidof hyprlock || hyprlock     # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session   # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # Avoid having to press a key twice for display
}

# Dim the screen after 2 minutes of inactivity
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10      # Set to 10% brightness
    on-resume = brightnessctl -r              # Restore previous brightness
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off displays after 5.5 minutes of inactivity
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = systemctl suspend
}

