background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_size = 4
    blur_passes = 2
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 1
    dots_size = 0.33
    dots_spacing = 0.15
    outer_color = rgb(35, 35, 35)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    rounding = 10
    fade_on_empty = false
    hide_input = false
    placeholder_text = <i></i>
    
    position = 0, 0
    halign = center
    valign = center
}
